name: Blog automation

on:
  schedule:
    # 평일 오전 9시 7분(KST) — 매일 쓰려면 '7 0 * * *'
    - cron: "7 0 * * 1-5"
  workflow_dispatch:
    inputs:
      provider:
        description: "AI (claude: Claude API / ollama: 러너 안에서 돌리는 로컬 모델)"
        type: choice
        options: [claude, ollama]
        default: claude
      topic:
        description: "주제 (비우면 topics.md 맨 위 주제)"
        type: string
        required: false
      ollama_model:
        description: "ollama일 때 쓸 모델"
        type: string
        default: "qwen2.5:3b"
      publish:
        description: "WordPress/웹훅에 발행"
        type: boolean
        default: true

concurrency:
  group: blog-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blog-automation
    env:
      BLOG_PROVIDER: ${{ inputs.provider || vars.BLOG_PROVIDER || 'claude' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      OLLAMA_MODEL: ${{ inputs.ollama_model || vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      BLOG_WEBHOOK_URL: ${{ secrets.BLOG_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-automation/package-lock.json
      - run: npm ci

      - name: Start Ollama (local model)
        if: env.BLOG_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      - name: Write post
        env:
          TOPIC: ${{ inputs.topic }}
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && '--no-publish' || '' }}
        run: |
          if [ -n "$TOPIC" ]; then
            npm run -s generate -- --provider "$BLOG_PROVIDER" --topic "$TOPIC" $NO_PUBLISH
          else
            npm run -s generate -- --provider "$BLOG_PROVIDER" $NO_PUBLISH
          fi

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts topics.md
          if git diff --cached --quiet; then echo "새 글 없음"; exit 0; fi
          git commit -m "블로그: 새 글 자동 작성"
          git push
