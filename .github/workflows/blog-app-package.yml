name: Blog app package

# 친구에게 보낼 "블로그 자동화" 프로그램 zip을 만들어 Releases에 올린다.
# 다운로드 주소: https://github.com/<owner>/<repo>/releases/tag/blog-app
on:
  workflow_dispatch:
  push:
    paths: ["blog-automation/**"]

permissions:
  contents: write

jobs:
  package:
    # 기본 브랜치에 들어온 변경만 배포한다.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p dist/blog-app
          cd blog-automation
          # 내 글·내 글감·비밀 설정은 빼고, 프로그램만 담는다.
          git ls-files | grep -vE '^(posts/.+\.md|settings\.json)$' | while read -r f; do
            mkdir -p "../dist/blog-app/$(dirname "$f")"; cp -p "$f" "../dist/blog-app/$f"
          done
          printf '# 글감 대기열\n\n- [ ] 첫 번째 글 주제를 여기에 적어 보세요\n' > ../dist/blog-app/topics.md
          chmod +x ../dist/blog-app/start-mac.command
          cd ../dist && zip -qr blog-app.zip blog-app
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="블로그 자동화 프로그램. blog-app.zip을 받아 압축을 풀고 start-windows.bat(윈도우) 또는 start-mac.command(맥)를 더블클릭하세요. (빌드: ${GITHUB_SHA::7})"
          if gh release view blog-app >/dev/null 2>&1; then
            gh release upload blog-app dist/blog-app.zip --clobber
            gh release edit blog-app --notes "$NOTES"
          else
            gh release create blog-app dist/blog-app.zip --title "블로그 자동화 프로그램" --notes "$NOTES" --latest=false
          fi
