# 로컬/단일 서버 배포용. 운영에서는 비밀 값을 .env(커밋 금지)로 주입한다.
# 실행: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: darak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darak}
      POSTGRES_DB: darak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darak"]
      interval: 5s
      retries: 10

  app:
    # 시작할 때 DB 마이그레이션을 자동으로 적용한다 (scripts/docker-entrypoint.sh)
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://darak:${POSTGRES_PASSWORD:-darak}@db:5432/darak?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@darak.app}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
