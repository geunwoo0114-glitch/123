# 로컬/단일 서버 배포용. 운영에서는 비밀 값을 .env(커밋 금지)로 주입한다.
# 실행: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: darak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darak}
      POSTGRES_DB: darak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darak"]
      interval: 5s
      retries: 10

  # 배포 전에 마이그레이션을 한 번 실행하고 끝난다
  migrate:
    build: { context: ., target: build }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://darak:${POSTGRES_PASSWORD:-darak}@db:5432/darak?schema=public
    depends_on:
      db: { condition: service_healthy }

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://darak:${POSTGRES_PASSWORD:-darak}@db:5432/darak?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@darak.app}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
