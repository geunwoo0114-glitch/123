# Render 블루프린트: 저장소를 연결하면 웹 서버 + PostgreSQL + 사진 저장 디스크를 한 번에 만든다.
# 사용법은 README의 '배포하기'를 보세요. 비밀 값(sync: false)은 Render 화면에서 직접 넣는다.
services:
  - type: web
    name: darak
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 한국에서 가장 가까운 Render 지역
    region: singapore
    # 영구 디스크(사진 저장)는 유료 플랜에서만 붙는다
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darak-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads
      # 비워 두면 Render 주소(https://<이름>.onrender.com)를 쓴다. 도메인을 연결하면 그 주소로 바꾼다.
      - key: APP_URL
        sync: false
      # 웹 푸시 키: `npx web-push generate-vapid-keys`로 만든 값을 넣는다 (비우면 푸시만 꺼짐)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@darak.app
      # 메일(이메일 인증·비밀번호 재설정): smtps://user:pass@smtp.example.com:465 (비우면 메일만 안 보냄)
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: 다락 <no-reply@darak.app>

databases:
  - name: darak-db
    region: singapore
    plan: basic-256mb
    databaseName: darak
    user: darak
    postgresMajorVersion: "16"
