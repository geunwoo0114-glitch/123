# Render 블루프린트: 저장소를 연결하면 웹 서버 + PostgreSQL을 한 번에 만든다. (카드 없이 무료로 시작)
# 사용법은 README의 '배포하기'를 보세요. 비밀 값(sync: false)은 Render 화면에서 넣거나 비워 둔다.
#
# 무료 플랜의 한계
# - 웹 서버: 15분 동안 아무도 안 들어오면 잠들고, 다음 접속 때 깨어나는 데 1분쯤 걸린다
# - 데이터베이스: 무료 PostgreSQL은 만든 지 30일 뒤 만료된다 → 그 전에 유료(basic-256mb)로 바꾼다
# - 디스크를 붙일 수 없어서 사진은 DB에 저장한다(STORAGE_DRIVER=db). 사진이 많아지면 S3/R2로 옮긴다
# 유료로 올릴 때: 아래 plan을 starter / basic-256mb 로 바꾸면 된다
services:
  - type: web
    name: darak
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 한국에서 가장 가까운 Render 지역
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darak-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: db
      # 비워 두면 Render 주소(https://<이름>.onrender.com)를 쓴다. 도메인을 연결하면 그 주소로 바꾼다.
      - key: APP_URL
        sync: false
      # 웹 푸시 키: `npx web-push generate-vapid-keys`로 만든 값을 넣는다 (비우면 푸시만 꺼짐)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@darak.app
      # 메일(이메일 인증·비밀번호 재설정): smtps://user:pass@smtp.example.com:465 (비우면 메일만 안 보냄)
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: 다락 <no-reply@darak.app>

databases:
  - name: darak-db
    region: singapore
    plan: free
    databaseName: darak
    user: darak
    postgresMajorVersion: "16"
